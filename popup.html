<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #131316;
      --surface-hover: #1c1c20;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #fafafa;
      --text-soft: #a1a1aa;
      --text-muted: #71717a;
      --accent: #fafafa;
      --accent-ink: #09090b;
      --live: #22c55e;
      --turbo: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 304px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Noto Sans Thai', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 12px;
      user-select: none;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .site-badge {
      font-size: 10.5px;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      max-width: 112px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Surface Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
    }

    /* ── Speed Display & Controls ── */
    .speed-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .speed-top .label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .speed-top-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .speed-step-btn {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-soft);
      font: 500 13px/1 inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }

    .speed-step-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .speed-step-btn.reset-btn {
      width: auto;
      padding: 0 6px;
      font-size: 10px;
    }

    .speed-top .value {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      min-width: 44px;
      text-align: right;
    }

    .speed-control {
      margin-bottom: 10px;
    }

    .speed-control input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      cursor: pointer;
    }

    .speed-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      transition: transform 0.12s ease;
    }

    .speed-control input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .speed-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .speed-actions button {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 5px 0;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font: 500 11px inherit;
      font-variant-numeric: tabular-nums;
      transition: all 0.14s ease;
    }

    .speed-actions button:hover,
    .speed-actions button:focus-visible {
      background: var(--surface-hover);
      color: var(--text);
      outline: none;
    }

    .speed-actions button.active {
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }

    /* ── Toggles ── */
    .toggle-row {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }

    .toggle-row:first-child { padding-top: 0; }
    .toggle-row:last-child { padding-bottom: 0; }

    .toggle-row:not(:last-child) {
      border-bottom: 1px solid var(--border);
    }

    .toggle-row .label {
      font-size: 12px;
      color: #e4e4e7;
      font-weight: 450;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* ── Minimal Switch ── */
    .switch {
      position: relative;
      width: 34px;
      height: 19px;
      flex: 0 0 auto;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      transition: background 0.18s ease;
      cursor: pointer;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 13px;
      height: 13px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #a1a1aa;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    input:checked + .slider {
      background: var(--accent);
    }

    #turboToggle:checked + .slider {
      background: var(--turbo);
    }

    input:checked + .slider::before {
      background: var(--accent-ink);
      transform: translateX(15px);
    }

    /* ── Compact Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 4px;
      text-align: center;
    }

    .stat-card .val {
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .stat-card .lbl {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Compact Shortcuts Bar ── */
    .shortcuts-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .sc-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    kbd {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text-soft);
      font-weight: 500;
    }

    /* ── Footer Status ── */
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10.5px;
      color: var(--text-muted);
      padding-top: 2px;
    }

    .status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--live);
    }

    /* ── Minimal Tooltips (Auto-fit inside card, never clips) ── */
    .info-help {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 9px;
      cursor: help;
      position: static;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .info-help:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    .info-help::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 4px);
      left: 0;
      right: 0;
      transform: translateY(4px);
      background: #18181b;
      border: 1px solid var(--border-strong);
      color: #e4e4e7;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 10.5px;
      font-weight: 400;
      line-height: 1.45;
      white-space: pre-line;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.6);
      z-index: 999;
      text-align: left;
    }

    .info-help:hover::after {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="stack">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M3.5 6.8C3.5 5.9 4.5 5.4 5.2 5.9L11.4 10.6C12 11.1 12 11.9 11.4 12.4L5.2 17.1C4.5 17.6 3.5 17.1 3.5 16.2V6.8Z" fill="currentColor" opacity="0.52"/>
            <path d="M12.5 6.8C12.5 5.9 13.5 5.4 14.2 5.9L20.4 10.6C21 11.1 21 11.9 20.4 12.4L14.2 17.1C13.5 17.6 12.5 17.1 12.5 16.2V6.8Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Speed Controller</h1>
          <p>v3.2 Minimal</p>
        </div>
      </div>
      <div id="currentSite" class="site-badge">loading...</div>
    </header>

    <section class="card">
      <div class="speed-top">
        <span class="label">สปีดปัจจุบัน</span>
        <div class="speed-top-right">
          <button type="button" id="speedMinusBtn" class="speed-step-btn" title="ลด 0.25x">−</button>
          <button type="button" id="speedResetBtn" class="speed-step-btn reset-btn" title="รีเซ็ตเป็น x1">1x</button>
          <button type="button" id="speedPlusBtn" class="speed-step-btn" title="เพิ่ม 0.25x">+</button>
          <span class="value" id="currentSpeedDisplay">x1</span>
        </div>
      </div>
      <div class="speed-control" aria-label="ปรับความเร็ววิดีโอ">
        <input id="speedRange" type="range" min="0.25" max="16" step="0.25" value="1" />
      </div>
      <div class="speed-actions">
        <button type="button" data-speed="1">x1</button>
        <button type="button" data-speed="1.5">x1.5</button>
        <button type="button" data-speed="2">x2</button>
        <button type="button" data-speed="3">x3</button>
        <button type="button" data-speed="4">x4</button>
        <button type="button" data-speed="6">x6</button>
        <button type="button" data-speed="8">x8</button>
        <button type="button" data-speed="16">x16</button>
      </div>
    </section>

    <section class="card">
      <div class="toggle-row">
        <span class="label">
          Ad Turbo (x16 + Mute)
          <span class="info-help" data-tooltip="เร่งโฆษณาวิดีโอเป็น x16 พร้อมปิดเสียง และคืนค่าเสียงกับสปีดเดิมอัตโนมัติเมื่อโฆษณาจบ">?</span>
        </span>
        <label class="switch" aria-label="Ad Turbo">
          <input id="turboToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="label">
          Ad Blocker (7-Layer)
          <span class="info-help" data-tooltip="บล็อกแบนเนอร์ ป๊อปอัป และองค์ประกอบโฆษณารกตาบนหน้าเว็บ">?</span>
        </span>
        <label class="switch" aria-label="Ad Blocker">
          <input id="adBlockerToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="label">
          Floating Panel
          <span class="info-help" data-tooltip="แสดงแผงควบคุมแบบลอยบนหน้าเว็บ (ลากย้ายตำแหน่งได้)">?</span>
        </span>
        <label class="switch" aria-label="Show Floating Panel">
          <input id="showPanelToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="label">
          Per-Site Speed
          <span class="info-help" data-tooltip="จดจำความเร็วแยกตามแต่ละเว็บไซต์ ไม่ปนกันระหว่างเว็บ">?</span>
        </span>
        <label class="switch" aria-label="Per-Site Speed">
          <input id="siteSpeedToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="label">
          Auto Next Lesson
          <span class="info-help" data-tooltip="คลิกปุ่ม 'ต้องการเรียนบทถัดไป' อัตโนมัติเมื่อจบบทเรียน&#10;ข้อควรระวัง: ควรเปิดเฉพาะตอนเรียนคอร์ส E-Learning">?</span>
        </span>
        <label class="switch" aria-label="Auto Next Lesson">
          <input id="autoNextToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="card">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="val" id="statSaved">0 วิ</div>
          <div class="lbl">ประหยัด</div>
        </div>
        <div class="stat-card">
          <div class="val" id="statTopSpeed">x1</div>
          <div class="lbl">สูงสุด</div>
        </div>
        <div class="stat-card">
          <div class="val" id="statVideos">0</div>
          <div class="lbl">วันนี้</div>
        </div>
        <div class="stat-card">
          <div class="val" id="statBlocked">0</div>
          <div class="lbl">บล็อก</div>
        </div>
      </div>
    </section>

    <section class="card shortcuts-bar">
      <span class="sc-item">เพิ่ม <kbd id="kbdRaise">]</kbd></span>
      <span class="sc-item">ลด <kbd id="kbdLower">[</kbd></span>
      <span class="sc-item">รีเซ็ต <kbd id="kbdReset">\</kbd></span>
      <span class="sc-item">Turbo <kbd id="kbdTurbo">t</kbd></span>
      <span class="sc-item">Boost <kbd>Space ค้าง</kbd></span>
    </section>

    <div class="status">
      <span class="dot"></span>
      <span>Active · Ctrl+Scroll บนวิดีโอ</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
